name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Full requirements.txt is deliberately not installed here: it pulls in
      # heavy runtime-only deps (openai-whisper, torch, etc.) not needed by tests/.
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/
